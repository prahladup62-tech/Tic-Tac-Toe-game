<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game (X vs O)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .cell {
            background: #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        .cell.x {
            color: #3498db; /* Original color for X (Blue) */
        }

        .cell.o {
            color: #e74c3c; /* Original color for O (Red) */
        }

        .cell:hover {
            background: #f0f0f0;
            transform: scale(1.02);
        }

        .cell.taken {
            cursor: not-allowed;
        }

        /* Java-like setWinner tile effect */
        .cell.winner-tile {
            background-color: #2ecc71 !important; /* GREEN background */
            color: #000000 !important; /* BLACK text */
        }

        .reset-btn {
            margin-top: 25px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            color: #1e3c72;
            background: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h1>Tic Tac Toe</h1>
    <div class="status" id="status">Player X's Turn</div>

    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button class="reset-btn" id="resetBtn">Restart Game</button>

    <script>
        const board = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');

        let currentPlayer = "X"; 
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        // Triggered when any cell is clicked
        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // Check if cell is already occupied or game is over
            if (gameState[clickedCellIndex] !== "" || !isGameActive) {
                return;
            }

            // Save and render the player's move
            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.innerText = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase(), 'taken');

            // Evaluate game results
            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            let winningLine = [];

            for (let i = 0; i < winningConditions.length; i++) {
                const winCondition = winningConditions[i];
                let a = gameState[winCondition[0]];
                let b = gameState[winCondition[1]];
                let c = gameState[winCondition[2]];

                if (a === '' || b === '' || c === '') continue;
                
                if (a === b && b === c) {
                    roundWon = true;
                    winningLine = winCondition; // Store winning cell indexes
                    break;
                }
            }

            // Accurate Win/Loss announcement logic
            if (roundWon) {
                isGameActive = false;

                // Highlight winning tiles with GREEN bg and BLACK text (Java style)
                winningLine.forEach(index => {
                    cells[index].classList.add('winner-tile');
                });

                if (currentPlayer === "X") {
                    statusText.innerText = "🎉 Player X Wins! (Player O Lost) ❌";
                    statusText.style.color = "#2ecc71"; // Green color for victory
                } else {
                    statusText.innerText = "🎉 Player O Wins! (Player X Lost) ❌";
                    statusText.style.color = "#2ecc71"; 
                }
                return;
            }

            // Match Tie logic
            let roundDraw = !gameState.includes("");
            if (roundDraw) {
                statusText.innerText = "Match Tie! 🤝 It's a Draw.";
                statusText.style.color = "#f1c40f"; // Yellow color for tie
                isGameActive = false;
                return;
            }

            // Switch Turns (X to O or O to X)
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusText.innerText = `Player ${currentPlayer}'s Turn`;
        }

        // Restart Game logic
        function resetGame() {
            currentPlayer = "X";
            gameState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            statusText.innerText = "Player X's Turn";
            statusText.style.color = "white";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.className = "cell"; // Clears 'taken' and 'winner-tile' classes
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetBtn.addEventListener('click', resetGame);
    </script>
</body>
</html>
